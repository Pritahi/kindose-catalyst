name: Proactive reminder check
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reminder-worker
  cancel-in-progress: false
jobs:
  remind:
    if: github.event.repository.private == false && vars.REMINDERS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check reminders
        env:
          APP_URL: ${{ vars.KIN_APP_URL }}
          CRON_SECRET: ${{ secrets.KIN_CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 50 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
